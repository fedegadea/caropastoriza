<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto — Carolina Pastoriza Hausmann</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F5F1E7'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-size='19' fill='%23B98A2F' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body class="oscura">
<div class="fondo" style="background-image:url('assets/contacto-fondo.jpg');background-position:70% center"></div>
<div class="velo" style="background:linear-gradient(100deg,rgba(25,18,2,.5),rgba(25,18,2,.08) 60%)"></div>
<header class="top">
  <a class="logo" href="./" style="color:var(--blanco);text-shadow:0 1px 12px rgba(0,0,0,.4)">Carolina Pastoriza Hausmann</a>
  <nav class="menu">
    <a href="./">Home</a>
    <a href="obra">Obra</a>
  </nav>
</header>
<main class="cont-wrap">
  <h1>CONTACTO</h1>
  <div class="cont-datos">
    <a id="mail" href="mailto:carolina.pastoriza@gmail.com">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="5" width="19" height="14" rx="1.5"/><path d="m3.5 6.5 8.5 7 8.5-7"/></svg>
      <span id="mailTxt">carolina.pastoriza@gmail.com</span>
    </a>
    <a id="ig" href="https://instagram.com/carolinapastoriza" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>
      <span id="igTxt">carolinapastoriza</span>
    </a>
  </div>
  <form class="cont-form" id="form">
    <input id="f-nombre" placeholder="Nombre" autocomplete="name" required>
    <input id="f-email" type="email" placeholder="Email" autocomplete="email">
    <textarea id="f-mensaje" placeholder="Mensaje" required></textarea>
    <button type="submit" id="f-btn">ENVIAR</button>
    <div class="cont-ok" id="f-ok" hidden></div>
  </form>
</main>
<script src="data/seed.js"></script>
<script src="js/base.js"></script>
<script>
CARO.promesa.then(d => {
  const t = d.textos;
  if (t.email) { document.getElementById('mail').href = 'mailto:' + t.email; document.getElementById('mailTxt').textContent = t.email; }
  if (t.instagram) { document.getElementById('ig').href = 'https://instagram.com/' + encodeURIComponent(t.instagram); document.getElementById('igTxt').textContent = t.instagram; }
});
document.getElementById('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = document.getElementById('f-btn'), ok = document.getElementById('f-ok');
  btn.disabled = true; btn.textContent = 'ENVIANDO…';
  try {
    const r = await fetch(CARO_API + '/contacto', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre: document.getElementById('f-nombre').value, email: document.getElementById('f-email').value, mensaje: document.getElementById('f-mensaje').value })
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    ok.hidden = false; ok.textContent = 'Gracias — tu mensaje fue enviado. Te responderemos a la brevedad.';
    ev.target.reset(); btn.textContent = 'ENVIADO ✓';
  } catch (e) {
    ok.hidden = false; ok.textContent = 'No se pudo enviar (' + e.message + '). Escribinos por mail, arriba.';
    btn.disabled = false; btn.textContent = 'ENVIAR';
  }
});
</script>
</body>
</html>
